<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products - Imara | Commerce</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
<script type="module" src="firebaseauth.js"></script>

<style>
    body {
        font-family: 'Poppins', sans-serif;
        padding: 20px;
        background-color: #f4f4f4;
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    form {
        max-width: 400px;
        margin: 0 auto 40px auto;
        padding: 25px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        transition: transform 0.3s ease;
    }
    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        transition: border 0.3s;
    }
    input:focus {
        border-color: #28a745;
        outline: none;
    }
    button {
        width: 100%;
        padding: 12px;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s, transform 0.2s;
    }
    button:hover {
        background: #218838;
        transform: translateY(-2px);
    }
    p {
        text-align: center;
    }

    /* Forgot Password Modal */
    #forgotPasswordModal {
        display: none;
        position: fixed;
        top:0; left:0;
        width:100%; height:100%;
        background: rgba(0,0,0,0.5);
        z-index:1000;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
    }
    #forgotPasswordModal .modal-content {
        background:#fff;
        padding: 30px 25px;
        border-radius:12px;
        width:90%;
        max-width:400px;
        text-align:center;
        position: relative;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        transform: scale(0.8);
        animation: scaleUp 0.3s forwards;
    }
    #forgotPasswordModal input {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border:1px solid #ccc;
        border-radius:6px;
    }
    #forgotPasswordModal button {
        background: #28a745;
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
    }
    #forgotPasswordModal button:hover {
        background: #218838;
    }
    #forgotPasswordModal span.close {
        position:absolute;
        top:12px;
        right:15px;
        cursor:pointer;
        font-weight:bold;
        font-size:22px;
        color:#333;
        transition: color 0.3s;
    }
    #forgotPasswordModal span.close:hover {
        color: #28a745;
    }
    #resetMessage {
        margin-top: 10px;
        font-size: 14px;
    }

    @keyframes scaleUp {
        to { transform: scale(1); }
    }
    @keyframes fadeIn {
        from { background: rgba(0,0,0,0); }
        to { background: rgba(0,0,0,0.5); }
    }
</style>
</head>

<body>
<div class="container">
    <div class="navbar">
        <div class="logo">
            <a href="index.html"><img src="images/ImaraCommerce_logo_transparent.png" width="150px"></a>
        </div>
        <nav>
            <ul id="MenuItems">
                <b><li><a href="index.html">Home</a></li></b>
                <b><li><a href="products.html">Products</a></li>
                <b><li><a href="About.html">About</a></li></b>
                <b><li><a href="Userloginpage.html">Account</a></li></b>
                <b><li><a href="order-history.html">My Order</a></li></b>
            </ul>
        </nav> 
        <div class="nav-actions">
          <a href="Cart33.html" class="cart-icon" aria-label="Cart">
            <img src="images/New cart icon.png" width="30" height="30" alt="Cart">
            <span id="cartCount" class="cart-badge" aria-live="polite"></span>
          </a>
          <span id="navUser" class="nav-user"></span>
          <img src="images/icons8-menu-50.png" class="menu-icon" onclick="menutoggle()" alt="Menu" />
        </div>
    </div> 

<h2>Sign Up</h2>
<form id="signupForm">
  <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
    <input type="text" id="suUsername" placeholder="Username" required />
    <input type="email" id="suEmail" placeholder="Email" required />
    <input type="password" id="suPassword" placeholder="Password (min 6)" required />
    <button type="submit" id="submitSignUp">SignUp</button>
</form>

<h2>Login</h2>
<form id="loginForm">
  <div id="loginMessage" class="messageDiv" style="display:none;"></div>
    <input type="text" id="email" placeholder="Username or Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit" id="submitLogin">Login</button>
    <p style="margin-top:10px; text-align:center;">
        <a href="#" id="forgotPassword" style="color:#28a745; cursor:pointer;">Forgot Password?</a>
    </p>
</form>

<!-- Forgot Password Modal -->
<div id="forgotPasswordModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <h3>Reset Your Password</h3>
        <input type="email" id="resetEmail" placeholder="Enter your email" required>
        <button id="resetBtn">Send Reset Link</button>
        <p id="resetMessage"></p>
    </div>
</div>

<script type="module">
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const auth = getAuth();

    // Show modal
    document.getElementById("forgotPassword").addEventListener("click", () => {
        document.getElementById("forgotPasswordModal").style.display = "flex";
    });

    // Close modal
    function closeModal() {
        document.getElementById("forgotPasswordModal").style.display = "none";
        document.getElementById("resetMessage").textContent = "";
        document.getElementById("resetEmail").value = "";
    }

    // Handle reset email
    document.getElementById("resetBtn").addEventListener("click", async () => {
        const email = document.getElementById("resetEmail").value;
        const msg = document.getElementById("resetMessage");

        if (!email) {
            msg.textContent = "Please enter your email.";
            msg.style.color = "red";
            return;
        }

        try {
            await sendPasswordResetEmail(auth, email);
            msg.textContent = "Password reset email sent! Check your inbox.";
            msg.style.color = "green";
        } catch (error) {
            console.error(error);
            msg.textContent = error.message;
            msg.style.color = "red";
        }
    });
</script>

<script>
    var MenuItems = document.getElementById("MenuItems");
    MenuItems.style.maxHeight = "0px";
    function menutoggle(){
        if(MenuItems.style.maxHeight == "0px") {
            MenuItems.style.maxHeight = "200px";
        } else {
            MenuItems.style.maxHeight = "0px"; 
        }   
    }
</script>

</body>
</html>
