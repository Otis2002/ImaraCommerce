<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  font-family: Poppins, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h2 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #28a745;
  color: white;
}

.status {
  font-weight: bold;
}

.pending { color: orange; }
.confirmed { color: green; }

button {
  padding: 6px 10px;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}

.confirm-btn {
  background: #28a745;
  color: white;
}

.delete-btn {
  background: #dc3545;
  color: white;
}

.logout-btn {
  background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
  color: white;
  padding: 12px 28px;
  border: none;
  border-radius: 25px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
  transition: all 0.3s ease;
  margin-top: 20px;
  display: inline-block;
}

.logout-btn:hover {
  background: linear-gradient(135deg, #ee5a6f, #dc3545);
  box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
  transform: translateY(-2px);
}

.logout-btn:active {
  transform: translateY(0);
  box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
}
</style>
</head>
<body>

<h2>📦 Admin Order Dashboard</h2>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>User</th>
      <th>Items</th>
      <th>Total (RWF)</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="ordersTable"></tbody>
</table>
<button onclick="adminLogout()" class="logout-btn">
  🚪 Logout
</button>

<script>
function adminLogout() {
  localStorage.removeItem("adminLoggedIn");
  window.location.href = "admin-login.html";
}
</script>

<script>
if (localStorage.getItem("adminLoggedIn") !== "true") {
  alert("Admin access required");
  window.location.href = "admin-login.html";
}
</script>
<script>
const ADMIN_PASSWORD = "Rwanda20002"; // 🔐 change this

const pass = prompt("Enter admin password:");
if (pass !== ADMIN_PASSWORD) {
  alert("Access denied");
  window.location.href = "index.html";
}

function loadOrders() {
  const orders = JSON.parse(localStorage.getItem("orders")) || [];
  const table = document.getElementById("ordersTable");
  table.innerHTML = "";

  orders.forEach((order, index) => {
    const items = order.items
      .map(i => `${i.name} x ${i.qty}`)
      .join("<br>");

    table.innerHTML += `
      <tr>
        <td>${order.orderId}</td>
        <td>${order.username}</td>
        <td>${items}</td>
        <td>${order.total.toLocaleString()}</td>
        <td class="status ${order.status === "Confirmed" ? "confirmed" : "pending"}">
          ${order.status}
        </td>
        <td>
          <button class="confirm-btn" onclick="confirmOrder(${index})">
            Confirm
          </button>
          <button class="delete-btn" onclick="deleteOrder(${index})">
            Delete
          </button>
        </td>
      </tr>
    `;
  });
}

function confirmOrder(index) {
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  orders[index].status = "Confirmed";
  localStorage.setItem("orders", JSON.stringify(orders));
  loadOrders();
}

function deleteOrder(index) {
  if (!confirm("Delete this order?")) return;
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  orders.splice(index, 1);
  localStorage.setItem("orders", JSON.stringify(orders));
  loadOrders();
}

loadOrders();
</script>

</body>
</html>
