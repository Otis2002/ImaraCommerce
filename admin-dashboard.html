<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Imara Commerce</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

  <style>
    body {
      font-family: Poppins, system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      margin: 0;
    }

    #loginModal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.5);
      z-index: 1000;
    }

    #loginModal.hidden { display: none; }

    .login-container {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header i {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .error-message.show { display: block; }

    #dashboard {
      display: none;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    #dashboard.show { display: block; }

    .dashboard-header {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .order-card {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginModal">
  <div class="login-container">
    <div class="login-header">
      <i class="fas fa-lock"></i>
      <h2>Admin Login</h2>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input id="username" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" required />
      </div>

      <button id="loginBtn">Login</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dashboard-header">
    <h2>Admin Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <div id="adminOrders"></div>
</div>

<script>
/* ================= CONFIG ================= */
const API_BASE = "https://imaracommerce.onrender.com";

/* ================= LOGIN ================= */
document.getElementById("loginForm").addEventListener("submit", handleLogin);

async function handleLogin(e) {
  e.preventDefault();

  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  const errorMsg = errorMessage;
  const btn = loginBtn;

  btn.disabled = true;
  errorMsg.classList.remove("show");

  try {
    const response = await fetch(`${API_BASE}/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Login failed");
    }

    sessionStorage.setItem("adminAuth", "true");
    loginModal.classList.add("hidden");
    dashboard.classList.add("show");

    loadOrders();
    initSSE();

  } catch (err) {
    errorMsg.textContent = "❌ " + err.message;
    errorMsg.classList.add("show");
  } finally {
    btn.disabled = false;
  }
}

/* ================= LOGOUT ================= */
function logout() {
  sessionStorage.removeItem("adminAuth");
  location.reload();
}

/* ================= AUTH CHECK ================= */
window.addEventListener("load", () => {
  if (sessionStorage.getItem("adminAuth")) {
    loginModal.classList.add("hidden");
    dashboard.classList.add("show");
    loadOrders();
    initSSE();
  }
});

/* ================= ORDERS ================= */
let orders = [];

async function loadOrders() {
  try {
    const res = await fetch(`${API_BASE}/orders`);
    orders = await res.json();
    renderOrders();
  } catch (e) {
    console.error("Orders load failed", e);
  }
}

function renderOrders() {
  adminOrders.innerHTML = "";
  orders.forEach(o => {
    const div = document.createElement("div");
    div.className = "order-card";
    div.innerHTML = `
      <strong>#${o.orderId}</strong><br/>
      User: ${o.username}<br/>
      Status: ${o.status}<br/>
      Total: ${o.total} RWF
    `;
    adminOrders.appendChild(div);
  });
}

/* ================= REALTIME ================= */
function initSSE() {
  const evt = new EventSource(`${API_BASE}/events`);

  evt.addEventListener("new-order", e => {
    orders.unshift(JSON.parse(e.data));
    renderOrders();
  });

  evt.onerror = () => {
    evt.close();
    setTimeout(initSSE, 5000);
  };
}
</script>

</body>
</html>
