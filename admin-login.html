<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  font-family: Poppins, sans-serif;
  background: linear-gradient(135deg, #28a745, #218838);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.login-box {
  background: white;
  padding: 30px;
  width: 350px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.login-box h2 {
  text-align: center;
  margin-bottom: 20px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.login-box button {
  width: 100%;
  padding: 12px;
  background: #28a745;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
}

.login-box button:hover {
  background: #218838;
}

.error {
  color: red;
  font-size: 14px;
  text-align: center;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>🔐 Admin Login</h2>

  <input type="text" id="adminUser" placeholder="Username">
  <input type="password" id="adminPass" placeholder="Password">

  <button onclick="adminLogin()">Login</button>
  <p class="error" id="errorMsg"></p>
</div>

<script>
const ADMIN_CREDENTIALS = {
  username: "jacq20002",
  password: "Rwanda20002" // CHANGE THIS
};

function adminLogin() {
  const user = document.getElementById("adminUser").value.trim();
  const pass = document.getElementById("adminPass").value.trim();
  const error = document.getElementById("errorMsg");

  if (
    user === ADMIN_CREDENTIALS.username &&
    pass === ADMIN_CREDENTIALS.password
  ) {
    localStorage.setItem("adminLoggedIn", "true");
    window.location.href = "admin.html";
  } else {
    error.textContent = "Invalid admin credentials";
  }
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCR-cbwXPSHW11_vPN6TnfkxphMJ2vMqAo",
  authDomain: "imaracommerce.firebaseapp.com",
  projectId: "imaracommerce",
  storageBucket: "imaracommerce.firebasestorage.app",
  messagingSenderId: "119240904494",
  appId: "1:119240904494:web:01716f673c92e888bd34bf"
};

export const app = initializeApp(firebaseConfig);
export const auth = getAuth(app);
export const db = getFirestore(app);
</script>
<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

async function adminLogin() {
  const email = document.getElementById("adminUser").value;
  const pass = document.getElementById("adminPass").value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "admin.html";
  } catch (err) {
    alert("Login failed");
  }
}
</script>

</body>
</html>
