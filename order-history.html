<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8" />
  <title>My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #f4f6f8, #e9eef3);
      padding: 20px;
      margin: 0;
    }

    .dashboard {
      max-width: 1000px;
      margin: auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 26px;
    }

    .user-info {
      background: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-size: 14px;
      line-height: 1.6;
    }

    .loyalty-points-display {
      color: #ff9800;
      font-weight: 600;
      display: inline-block;
      margin-top: 6px;
    }

    /* Orders grid */
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    /* Order card */
    .order-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: transform 0.2s ease;
    }

    .order-card:hover {
      transform: translateY(-4px);
    }

    .order-card p {
      margin: 6px 0;
      font-size: 14px;
    }

    .order-id {
      font-weight: 600;
      font-size: 15px;
    }

    /* Status badge */
    .order-status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin: 8px 0;
    }

    .Pending {
      background: #fff3cd;
      color: #856404;
    }

    .Paid {
      background: #d4edda;
      color: #155724;
    }

    .Delivered {
      background: #d1ecf1;
      color: #0c5460;
    }

    ul {
      padding-left: 18px;
      margin: 10px 0;
    }

    ul li {
      font-size: 13px;
      color: #555;
    }

    .order-total {
      margin-top: 10px;
      font-weight: 600;
      font-size: 15px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
      font-size: 15px;
    }

    .whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.whatsapp-btn:hover {
  background: #1ebe5d;
}

/* General button style */
button {
  background-color: #2563eb;   /* Blue background */
  color: white;               /* White text */
  border: none;               /* No border */
  border-radius: 8px;         /* Rounded corners */
  padding: 10px 20px;         /* Space inside the button */
  cursor: pointer;            /* Pointer on hover */
  font-size: 10px;            /* Text size */
  font-weight: 600;           /* Bold text */
  transition: background 0.3s, transform 0.2s;
}

/* Hover effect */
button:hover {
  background-color: #1d4ed8;  /* Darker blue on hover */
  transform: translateY(-2px);
}

/* Make the <a> inside inherit styles */
button a {
  text-decoration: none;      /* Remove underline */
  color: inherit;             /* Inherit text color from button */
  display: inline-block;
}



  </style>
</head>

<body>

<a href="https://wa.me/250781106751?text=Hello%20I%20want%20to%20ask%20about%20my%20order"
   target="_blank"
   class="whatsapp-btn">
   💬 Chat on WhatsApp
</a>

<div class="dashboard">

  <div class="header">
    <h2>📦 My Orders</h2>
    <div>
      <div id="userInfo" class="user-info"></div>
      <div id="loyaltyPointsDisplay" style="margin-top: 10px;"></div>
    </div>
  </div>

 <button><a href="index.html"><strong>Go back home</strong></a></button>

  <div id="ordersContainer" class="orders-grid">
    Loading orders...
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="loyalty-points.js"></script>
<script src="order-history.js"></script>


</body>
</html>
